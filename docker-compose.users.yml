version: "3.9"

services:
  usuarios:
    build:
      context: ./tcg-usuarios
      dockerfile: Dockerfile
    container_name: tcgshop-usuarios
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: tcg_usuarios

      SPRING_DATASOURCE_URL: "jdbc:mysql://172.31.24.157:3306/tcg_usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "tcguser"
      SPRING_DATASOURCE_PASSWORD: "TcgPass123!"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.mariadb.jdbc.Driver"

      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQL8Dialect"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"

      JWT_SECRET: "ClaveSecreta123"
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: "*"
